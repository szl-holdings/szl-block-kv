# SPDX-License-Identifier: Apache-2.0
# QHAPAQ quality bar: one CPU kernel smoke. Not a 229-workflow copy.
name: kernel-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-smoke:
    name: kernel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: torch-ext
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install pytest and CPU torch
        run: python -m pip install pytest torch

      - name: Run kernel smoke
        run: python -m pytest tests/ -q --tb=short
