type: kernel
repo_id: SZLHOLDINGS/szl-block-kv
title: szl-block-kv
summary: >-
  **Original SZL construction in the paged-KV category.** Inspired by Kwon et al.
  PagedAttention SOSP 2023 https://arxiv.org/abs/2309.06180.
  **NOT a rehost of vLLM or kernels-community/paged-attention.**
  **Distinct from a11oy MODELED H2O eviction.**
  v0 is a labeled torch gather over a block table with SHA3-256 receipts.
  The GPU Triton page kernel is **UNAVAILABLE**. No speedup claim.
