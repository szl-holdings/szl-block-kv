  license: apache-2.0
  library_name: kernels
  tags:
    - kernel
    - paged-attention
    - kv-cache
    - provenance
    - szl-holdings
  szl:
    source_repo: szl-holdings/szl-block-kv
    proof_url: https://github.com/szl-holdings/szl-block-kv
kernel:
  backends:
    - cpu (torch gather)
  load: |
    import re

    # CPU-only release recorded in hf/releases/20261003-cache-index-cpu.json.
    KERNEL_REVISION = "54a19796ee2c4f761c9482f77dd1f989a773e17f"
    if re.fullmatch(r"[0-9a-f]{40}", KERNEL_REVISION) is None:
        raise ValueError("An immutable 40-character Kernel Hub commit is required")

    # This loads and executes remote Python code; review the pinned source first.
    from kernels import get_kernel

    kv = get_kernel(
        "SZLHOLDINGS/szl-block-kv",
        revision=KERNEL_REVISION,
        backend="cpu",
        trust_remote_code=True,
    )
    print(kv.selfcheck())
sections:
  - heading: Doctrine
    body: >-
      Doctrine v11. **Λ = Conjecture 1 OPEN** (advisory; uniqueness unproven, not
      proven trust). GitHub is the source; the Hub is a separately observed
      publication target.
  - heading: Invariant-keyed blocks
    body: |
      A paged-KV block addressed by its token content alone is reusable by any request
      that presents the same tokens. That is arithmetically sound and governance-unsound:
      a block computed while a permissive invariant bundle was in force can be served to
      a request running under a stricter one, and nothing in the cache layer can see the
      difference.

      `InvariantKeyedBlockTable` makes the governance regime part of the address:

      ```
      block_key = SHA3-256( "szl.block-kv.invariant-key" || canonical(token_ids) || bundle_id )
      ```

      Same tokens under a different bundle produce a different key, so the lookup misses
      and the block is recomputed under the regime that asked for it. There is no code
      path that returns a block keyed to another bundle.

      ```python
      from szl_block_kv import InvariantBundle, InvariantKeyedBlockTable, ReceiptChain

      permissive = InvariantBundle(doctrine="v11", policy_class="default-permissive",
                                  receipts_required=True, verifier_budget=0)
      strict = permissive.derive(policy_class="default-strict", verifier_budget=3)

      chain = ReceiptChain()
      table = InvariantKeyedBlockTable(num_blocks=1024, chain=chain)
      run = [15496, 11, 995, 13]

      table.lookup(run, permissive)      # (None, "miss_cold")
      physical = table.admit(run, permissive)
      table.lookup(run, permissive)      # (physical, "hit")
      table.lookup(run, strict)          # (None, "miss_cross_regime")  <- containment
      chain.verify()                     # (True, 4, -1)
      ```

      A cross-regime miss is reported distinctly from a cold miss, because the two mean
      different things operationally: a cold miss is capacity or novelty, a cross-regime
      miss is governance doing its job. `table.audit()` asserts structurally that no
      physical block serves two regimes, and every lookup, admission, rejection, and
      eviction is appended to the same SHA3-256 receipt chain as `paged_attn`.

      Self-check: `from szl_block_kv import selfcheck_invariant; selfcheck_invariant()`
  - heading: Local source tree
    body: |
      Put `torch-ext/` on `PYTHONPATH`, then:

      ```python
      from szl_block_kv import PagedCache, paged_attn, reshape_and_cache, selfcheck
      print(selfcheck())
      ```
  - heading: Source and Hub release scope
    body: |
      Loading with `trust_remote_code=True` executes code from the selected first-class
      Kernel Hub repository. Review that immutable source and use a compatible
      `kernels` client (the recorded CPU qualification used 0.16.1) before running it.
      The pinned provider revision above is distinct from GitHub source commit
      `217e3b24017cd5fadb2525a7b5207f7c89a46413` and from the separately owned
      model-type twin. The syntax guard alone does not establish qualification.

      The first-class Kernel Hub build at that revision is published. The
      [source-bound CPU release record](https://github.com/szl-holdings/szl-block-kv/blob/ff4bc118f694dabf3d9b7a7dada65dbf7b2307d4/hf/releases/20261003-cache-index-cpu.json)
      reports 92 synthetic conformance tests passed, with no independent replay,
      GPU/Triton qualification, speed, or energy claim. This generated GitHub card
      is not automatically mirrored to either Hub twin (`BLOCKED_NOT_CONFIGURED`);
      its current Hub publication state requires a separate exact-revision readback.
claims:
  - label: REPORTED
    claim: >-
      Cross-regime containment. The 14 tests in the
      [pinned test source](https://github.com/szl-holdings/szl-block-kv/blob/49a96b6386b8ea22db20810c8d96ac0ac7083970/tests/test_invariant.py)
      cover canonical bundle ids, domain separation against boundary confusion, hit vs cold miss vs
      cross-regime miss, refusal to rebind a physical block across regimes, no physical
      block serving two regimes (4 regimes x 3 runs), auditability across FIFO eviction,
      and receipt-chain depth. This describes test source, not a fresh run result.
      What-NOT: not a proof about attention arithmetic.
  - label: REPORTED
    claim: >-
      Reuse fidelity under one regime. The
      [pinned test source](https://github.com/szl-holdings/szl-block-kv/blob/49a96b6386b8ea22db20810c8d96ac0ac7083970/tests/test_invariant.py)
      defines `test_reuse_under_the_same_regime_is_numerically_exact`, which asserts
      that a served hit is `torch.equal` to recompute, and that both match
      noncausal contiguous-KV SDPA within atol/rtol 1e-5 on float32. This describes
      test source, not a fresh run result.
  - label: REPORTED
    claim: >-
      Noncausal paged gather correctness. The
      [pinned test source](https://github.com/szl-holdings/szl-block-kv/blob/49a96b6386b8ea22db20810c8d96ac0ac7083970/tests/test_block_kv.py)
      asserts that
      paged attention over shuffled pages and over partial context lengths
      matches contiguous-KV SDPA with `is_causal=False` within atol/rtol 1e-5
      on float32. This describes test source, not a fresh run result, and does not
      establish causal attention.
  - label: REPORTED
    claim: >-
      CPU `get_kernel` load from the Kernel Hub (kernels 0.16.1, `build/torch-universal`
      and `build/torch-cpu`, `selfcheck` ok) and a local pytest run, recorded 2026-08-29
      in the Hub-only `BENCH.laptop-blackwell.json` and `OPERATIONAL.json` against source
      commit 7cf99cca. No receipt for them is committed in this repository.
  - label: REPORTED
    claim: >-
      The first-class Kernel Hub revision 54a19796ee2c4f761c9482f77dd1f989a773e17f
      is source-bound to GitHub 217e3b24017cd5fadb2525a7b5207f7c89a46413. Its
      CPU-only synthetic qualification record reports 92 tests passed, 0 failed,
      and 0 skipped. Independent replay, GPU, Triton, speed, and energy are not
      established by this record.
    receipt: https://github.com/szl-holdings/szl-block-kv/blob/ff4bc118f694dabf3d9b7a7dada65dbf7b2307d4/hf/releases/20261003-cache-index-cpu.json
  - label: UNAVAILABLE
    claim: GPU Triton page kernel. It is not in v0; no cubin and no timed GPU run exist.
  - label: UNAVAILABLE
    claim: Eviction quality. v0 eviction is FIFO; no eviction-quality or hit-rate claim is made.
  - label: UNAVAILABLE
    claim: >-
      Cost of keying. The hit-rate cost of narrowing the keyspace by bundle is not
      measured here. Measure it on your own traffic before promotion.
  - label: UNAVAILABLE
    claim: Speed-up, tokens/s, and energy measurements for this CPU-only release.
limits:
  - Kernel, not weights. Not a drop-in vLLM replacement.
  - Receipts prove integrity and declared origin only; they do not prove accuracy, readiness or performance.
