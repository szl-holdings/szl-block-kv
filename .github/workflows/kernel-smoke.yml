# SPDX-License-Identifier: Apache-2.0
# QHAPAQ quality bar: one CPU kernel smoke. Not a 229-workflow copy.
name: kernel-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-smoke:
    name: kernel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: torch-ext
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install pytest and CPU torch
        run: python -m pip install pytest torch

      - name: Run kernel smoke
        run: python -m pytest tests/ -q --tb=short
